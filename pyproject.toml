[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "draw_excel_cdf"
version = "0.1.0"
description = "可靠性统计 Excel 工具 — CDF/Weibull 分析 + Excel 散点图"
requires-python = ">=3.9"
dependencies = [
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
